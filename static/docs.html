<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База Знаний - Tectum Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .docs-sidebar {
            width: 280px;
            background: #1e293b;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 2rem;
        }

        .folder-tree-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .folder-tree-node {
            margin-left: 0.5rem;
            border-left: 1px dashed rgba(255, 255, 255, 0.1);
            padding-left: 0.5rem;
            display: none;
        }
        .folder-tree-node.expanded {
            display: block;
        }
        .folder-item-wrapper {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-bottom: 0.2rem;
        }
        .folder-tree-toggle {
            cursor: pointer;
            width: 1.2rem;
            text-align: center;
            color: #64748b;
            font-size: 0.75rem;
            transition: transform 0.2s;
        }
        .folder-tree-toggle.expanded {
            transform: rotate(90deg);
        }
        .folder-item-tree {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.6rem;
            color: #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .folder-item-tree:hover, .folder-item-tree.active {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }
        
        #sidebar-folders {
            flex: 1;
            overflow-y: auto;
            margin-right: -0.5rem;
            padding-right: 0.5rem;
            margin-bottom: 1rem;
        }

        #sidebar-folders::-webkit-scrollbar {
            width: 6px;
        }
        #sidebar-folders::-webkit-scrollbar-track {
            background: transparent;
        }
        #sidebar-folders::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        #sidebar-folders::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Main Content */
        .docs-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 2rem;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 450px;
        }

        .search-box input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(30, 41, 59, 0.8);
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3b82f6;
            background: #1e293b;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .action-buttons {
            display: flex;
            gap: 0.8rem;
        }

        .btn-action {
            padding: 0.65rem 1.1rem;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-create-folder {
            background: #334155;
            color: #f8fafc;
        }
        .btn-create-folder:hover { background: #475569; }

        .btn-upload-folder {
            background: #10b981;
            color: white;
        }
        .btn-upload-folder:hover { background: #059669; }

        .btn-upload-file {
            background: #3b82f6;
            color: white;
        }
        .btn-upload-file:hover { background: #2563eb; }

        .btn-create-gdoc {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
        }
        .btn-create-gdoc:hover { background: #1e40af; }

        .btn-create-gsheet {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
        }
        .btn-create-gsheet:hover { background: #047857; }

        .btn-back {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .btn-back:hover {
            color: #fff;
            border-color: #94a3b8;
        }

        .page-title {
            margin: 0 0 1.5rem 0;
            font-size: 1.6rem;
            font-weight: 700;
        }

        /* Table / List View (Google Drive style) */
        .docs-table {
            display: flex;
            flex-direction: column;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            user-select: none;
        }

        .docs-table-header {
            display: grid;
            grid-template-columns: 2fr 1fr 100px;
            padding: 0.8rem 1.2rem;
            background: rgba(15, 23, 42, 0.8);
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .docs-table-row {
            display: grid;
            grid-template-columns: 2fr 1fr 100px;
            padding: 0.85rem 1.2rem;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.15s;
            cursor: default;
        }

        .docs-table-row:last-child {
            border-bottom: none;
        }

        .docs-table-row:hover, .docs-table-row.selected {
            background: rgba(51, 65, 85, 0.45);
        }

        .folder-row {
            cursor: pointer;
        }

        .row-name {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            overflow: hidden;
        }

        .item-title {
            color: #f1f5f9;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-link {
            color: #f1f5f9;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .file-link:hover {
            text-decoration: underline;
            color: #60a5fa;
        }

        .row-meta {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .row-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-icon:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-icon-delete:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .btn-icon-more {
            font-size: 1.1rem;
        }

        /* Context Menu (Google Drive Style) */
        .context-menu {
            position: fixed;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 6px 0;
            min-width: 230px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            z-index: 9999;
            display: none;
            font-size: 0.9rem;
            backdrop-filter: blur(12px);
            animation: fadeIn 0.12s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 16px;
            color: #e2e8f0;
            cursor: pointer;
            transition: background 0.15s;
        }

        .context-menu-item:hover {
            background: rgba(59, 130, 246, 0.2);
            color: #ffffff;
        }

        .context-menu-item i {
            width: 16px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .context-menu-item:hover i {
            color: #60a5fa;
        }

        .context-menu-item.danger {
            color: #f87171;
        }

        .context-menu-item.danger i {
            color: #f87171;
        }

        .context-menu-item.danger:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .context-menu-separator {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 5px 0;
        }

        /* Toast notification */
        .toast-msg {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #3b82f6;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            z-index: 10000;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dropdown New Button */
        .dropdown-menu-create {
            position: relative;
            display: inline-block;
        }

        .dropdown-content-create {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 6px;
            background: #1e293b;
            min-width: 210px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
            padding: 6px 0;
        }

        .dropdown-content-create.show {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            color: #f1f5f9;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .dropdown-item:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            width: 420px;
            max-width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 1.2rem;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 0.65rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-cancel:hover { color: #fff; border-color: #94a3b8; }
    </style>
</head>
<body>
    <div class="docs-sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-folder-tree"></i> База Знаний
        </div>
        
        <div class="folder-tree-title">Главные разделы</div>
        <div id="sidebar-folders">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>
        </div>
        
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 0.6rem;">
            <a href="/static/tasks.html" style="color: #60a5fa; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; font-weight: 600; padding: 0.4rem 0.6rem; background: rgba(59, 130, 246, 0.15); border-radius: 6px; transition: 0.2s;">
                <i class="fas fa-bullseye"></i> Планнер задач
            </a>
            <a href="/static/index.html" style="color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#94a3b8'">
                <i class="fas fa-home"></i> На главную
            </a>
        </div>
    </div>


    <div class="docs-content" id="main-content-area" oncontextmenu="handleAreaContextMenu(event)">
        <div class="top-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Поиск в Базе Знаний..." oninput="handleSearch(this.value)">
            </div>
            <div class="action-buttons">
                <!-- Dropdown Создать -->
                <div class="dropdown-menu-create">
                    <button class="btn-action btn-upload-file" onclick="toggleCreateDropdown(event)" style="background: linear-gradient(135deg, #2563eb, #3b82f6); box-shadow: 0 4px 12px rgba(37,99,235,0.3);">
                        <i class="fas fa-plus"></i> Создать <i class="fas fa-chevron-down" style="font-size:0.75rem; margin-left:4px;"></i>
                    </button>
                    <div id="create-dropdown" class="dropdown-content-create">
                        <div class="dropdown-item" onclick="openCreateDocModal('document')">
                            <i class="fas fa-file-word" style="color: #3b82f6;"></i> Google Документ
                        </div>
                        <div class="dropdown-item" onclick="openCreateDocModal('spreadsheet')">
                            <i class="fas fa-file-excel" style="color: #10b981;"></i> Google Таблицу
                        </div>
                        <div class="context-menu-separator"></div>
                        <div class="dropdown-item" onclick="showFolderModal()">
                            <i class="fas fa-folder-plus" style="color: #f59e0b;"></i> Новую папку
                        </div>
                    </div>
                </div>

                <button class="btn-action btn-upload-folder" onclick="document.getElementById('folder-upload').click()">
                    <i class="fas fa-folder-open"></i> Загрузить папку
                </button>
                <input type="file" id="folder-upload" webkitdirectory directory multiple style="display: none;" onchange="handleFolderUpload(event)">
                
                <button class="btn-action btn-create-folder" onclick="document.getElementById('file-upload').click()">
                    <i class="fas fa-cloud-upload-alt"></i> Загрузить файл
                </button>
                <input type="file" id="file-upload" style="display: none;" onchange="handleFileUpload(event)">
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button id="btn-back" class="btn-back" style="display: none;" onclick="goUp()">
                    <i class="fas fa-arrow-left"></i> Назад
                </button>
                <h1 id="current-folder-name" class="page-title" style="margin-bottom: 0;">Главная директория</h1>
            </div>
            <div>
                <select id="docs-sort" style="padding: 0.5rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: #1e293b; color: white;" onchange="applySort()">
                    <option value="date_desc">Сначала новые (по дате)</option>
                    <option value="date_asc">Сначала старые (по дате)</option>
                    <option value="name_asc">По имени (А-Я)</option>
                    <option value="name_desc">По имени (Я-А)</option>
                </select>
            </div>
        </div>

        <div id="files-container">
            <!-- Файлы и папки загрузятся сюда в формате таблицы -->
        </div>
    </div>

    <!-- Модалка новой папки -->
    <div id="folder-modal" class="modal">
        <div class="modal-content">
            <h3>Создать новую папку</h3>
            <div class="form-group">
                <label>Название папки</label>
                <input type="text" id="new-folder-name" placeholder="Например: Отдел кадров" onkeydown="if(event.key==='Enter') createFolder()">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeFolderModal()">Отмена</button>
                <button class="btn-action btn-upload-file" onclick="createFolder()">Создать</button>
            </div>
        </div>
    </div>

    <!-- Модалка создания Google Документа / Таблицы -->
    <div id="create-doc-modal" class="modal">
        <div class="modal-content">
            <h3 id="create-doc-modal-title">Создать Google Документ</h3>
            <div class="form-group">
                <label>Название файла</label>
                <input type="text" id="new-doc-name" placeholder="Например: Сменный рапорт" onkeydown="if(event.key==='Enter') submitCreateGoogleDoc()">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCreateDocModal()">Отмена</button>
                <button class="btn-action btn-upload-file" id="btn-submit-create-doc" onclick="submitCreateGoogleDoc()">Создать</button>
            </div>
        </div>
    </div>

    <!-- Модалка переименования -->
    <div id="rename-modal" class="modal">
        <div class="modal-content">
            <h3>Переименовать</h3>
            <div class="form-group">
                <label>Новое имя</label>
                <input type="text" id="rename-input" placeholder="Введите имя..." onkeydown="if(event.key==='Enter') submitRename()">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeRenameModal()">Отмена</button>
                <button class="btn-action btn-upload-file" onclick="submitRename()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Контекстное меню (Google Drive Style) -->
    <div id="custom-context-menu" class="context-menu"></div>

    <!-- Toast уведомление -->
    <div id="toast" class="toast-msg">
        <i class="fas fa-check-circle" style="color: #10b981;"></i>
        <span id="toast-text">Ссылка скопирована в буфер</span>
    </div>

    <script>
        let currentFolderId = null;
        let parentFolderIdHistory = [];
        let folderNameHistory = [];
        let searchTimeout = null;
        let expandedFolders = new Set();
        let currentFoldersData = [];
        let currentFilesData = [];

        function applySort() {
            const sortVal = document.getElementById('docs-sort').value;
            let folders = [...currentFoldersData];
            let files = [...currentFilesData];
            
            const sortBy = (arr, isFolder) => {
                arr.sort((a, b) => {
                    if (sortVal === 'name_asc') {
                        return a.name.localeCompare(b.name);
                    } else if (sortVal === 'name_desc') {
                        return b.name.localeCompare(a.name);
                    } else if (sortVal === 'date_desc') {
                        const dateA = isFolder ? a.created_at : (a.uploaded_at ? new Date(a.uploaded_at).getTime() : 0);
                        const dateB = isFolder ? b.created_at : (b.uploaded_at ? new Date(b.uploaded_at).getTime() : 0);
                        return dateB - dateA;
                    } else if (sortVal === 'date_asc') {
                        const dateA = isFolder ? a.created_at : (a.uploaded_at ? new Date(a.uploaded_at).getTime() : 0);
                        const dateB = isFolder ? b.created_at : (b.uploaded_at ? new Date(b.uploaded_at).getTime() : 0);
                        return dateA - dateB;
                    }
                    return 0;
                });
            };
            
            sortBy(files, false);
            sortBy(folders, true);
            
            const strictOrder = {
                // Orange
                "Должностные инструкции по всем сотрудникам": 0,
                "ОТ и ТБ": 1,
                "Договора с подрядчиками": 2,
                // Purple
                "Отдел кадров": 3,
                "Коммерческий департамент": 4,
                "Технический директор": 5,
                "Финансовый директор": 6,
                "Начальник производства": 7,
                // Green
                "Главный технолог": 8,
                "Служба контроля качества": 9,
                "Бережливое производство": 10,
                "ОГМ": 11
            };
            
            folders.sort((a, b) => {
                const orderA = strictOrder.hasOwnProperty(a.name) ? strictOrder[a.name] : 999;
                const orderB = strictOrder.hasOwnProperty(b.name) ? strictOrder[b.name] : 999;
                if (orderA !== orderB) {
                    return orderA - orderB;
                }
                return 0;
            });

            renderItems(folders, files);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function getFileIcon(mimeType, fileName = '') {
            const name = fileName.toLowerCase();
            if (mimeType.includes('pdf') || name.endsWith('.pdf')) {
                return { icon: 'fas fa-file-pdf', color: '#ef4444' };
            }
            if (mimeType.includes('spreadsheet') || mimeType.includes('excel') || name.endsWith('.xlsx') || name.endsWith('.xls')) {
                return { icon: 'fas fa-file-excel', color: '#10b981' };
            }
            if (mimeType.includes('document') || mimeType.includes('word') || name.endsWith('.docx') || name.endsWith('.doc')) {
                return { icon: 'fas fa-file-word', color: '#3b82f6' };
            }
            if (mimeType.includes('image') || name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.jpeg')) {
                return { icon: 'fas fa-file-image', color: '#f59e0b' };
            }
            return { icon: 'fas fa-file-alt', color: '#94a3b8' };
        }

        function getFileTypeName(fileName, mimeType) {
            const ext = fileName.split('.').pop().toUpperCase();
            if (ext && ext !== fileName.toUpperCase()) return `${ext} документ`;
            return 'Документ';
        }

        function getFolderColor(name) {
            const n = name.toLowerCase();
            if (n.includes('техдир') || n.includes('техническ') || n.includes('финансов') || n.includes('начальник') || n.includes('кадров') || n.includes('коммерч')) return '#8b5cf6';
            if (n.includes('скк') || n.includes('контроля') || n.includes('огм') || n.includes('сырь') || n.includes('опи') || n.includes('технолог') || n.includes('техсовет') || n.includes('бережлив')) return '#10b981';
            if (n.includes('тб') || n.includes('норматив') || n.includes('договор') || n.includes('инструкци') || n.includes('регламент')) return '#f59e0b';
            if (n.includes('аци') || n.includes('агб')) return '#ef4444';
            return '#60a5fa';
        }

        function getWebViewLink(file) {
            const name = (file.name || '').toLowerCase();
            if (isEditableFile(name)) {
                return `/editor?id=${file.id}`;
            }
            return file.webViewLink;
        }

        function isEditableFile(fileName) {
            const name = (fileName || '').toLowerCase();
            return name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.docx') || name.endsWith('.doc') || name.endsWith('.pptx') || name.endsWith('.ppt');
        }

        function getFolderPasswordHeader() {
            const pwd = sessionStorage.getItem('folder_password');
            return pwd ? { 'X-Folder-Password': pwd } : {};
        }

        let currentFolderProtected = false;

        async function ensurePassword(isProtected) {
            if (!isProtected) return true;
            let pwd = sessionStorage.getItem('folder_password');
            if (!pwd) {
                pwd = prompt("Для этого действия требуется пароль. Введите пароль:");
                if (!pwd) return false;
                sessionStorage.setItem('folder_password', pwd);
            }
            return true;
        }

        async function openFileLink(viewUrl, isProtected, event) {
            if (event) event.preventDefault();
            if (!await ensurePassword(isProtected)) return;
            let finalUrl = viewUrl;
            if (isProtected) {
                const pwd = sessionStorage.getItem('folder_password');
                if (pwd) {
                    finalUrl += (finalUrl.includes('?') ? '&' : '?') + 'pwd=' + encodeURIComponent(pwd);
                }
            }
            window.open(finalUrl, '_blank');
        }

        async function loadDocuments(folderId = null, folderName = 'Главная директория', addToHistory = true, searchQuery = null, isProtected = false) {
            currentFolderProtected = isProtected;
            const container = document.getElementById('files-container');
            const sidebar = document.getElementById('sidebar-folders');
            
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка документов...</div>';
            
            try {
                let url = '/api/documents/list';
                const params = new URLSearchParams();
                if (searchQuery) {
                    params.append('q', searchQuery);
                } else if (folderId) {
                    params.append('parent_id', folderId);
                }
                if (params.toString()) {
                    url += '?' + params.toString();
                }
                
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.status === 'success') {
                    if (addToHistory && currentFolderId !== folderId && !searchQuery) {
                        if (currentFolderId) {
                            parentFolderIdHistory.push(currentFolderId);
                            folderNameHistory.push(document.getElementById('current-folder-name').innerText);
                        }
                    }
                    
                    if (!searchQuery) {
                        currentFolderId = folderId;
                    }
                    document.getElementById('current-folder-name').innerText = folderName;
                    
                    const btnBack = document.getElementById('btn-back');
                    if (parentFolderIdHistory.length > 0 && !searchQuery) {
                        btnBack.style.display = 'inline-flex';
                    } else {
                        btnBack.style.display = 'none';
                    }

                    currentFoldersData = data.data.folders;
                    currentFilesData = data.data.files;
                    applySort();
                    
                } else {
                    container.innerHTML = `<div style="color: #ef4444; padding: 2rem;">Ошибка: ${data.message}</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div style="color: #ef4444; padding: 2rem;">Ошибка загрузки данных</div>`;
            }
        }

        function handleSearch(query) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const trimmed = query.trim();
                if (trimmed.length > 0) {
                    loadDocuments(null, `Результаты поиска: "${trimmed}"`, false, trimmed);
                } else {
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                }
            }, 300);
        }

        async function loadSidebarTree() {
            try {
                const res = await fetch('/api/documents/tree');
                const data = await res.json();
                if (data.status === 'success') {
                    const folders = data.data;
                    const sidebar = document.getElementById('sidebar-folders');
                    sidebar.innerHTML = '';
                    
                    const folderMap = {};
                    const rootFolders = [];
                    folders.forEach(f => {
                        f.children = [];
                        folderMap[f.id] = f;
                    });
                    
                    folders.forEach(f => {
                        if (f.parent_id && folderMap[f.parent_id]) {
                            folderMap[f.parent_id].children.push(f);
                        } else {
                            rootFolders.push(f);
                        }
                    });
                    
                    rootFolders.forEach(root => {
                        sidebar.appendChild(renderTreeNode(root));
                    });
                }
            } catch (error) {
                console.error("Tree load error:", error);
            }
        }

        function renderTreeNode(folder) {
            const wrapper = document.createElement('div');
            
            const header = document.createElement('div');
            header.className = 'folder-item-wrapper';
            
            const toggle = document.createElement('div');
            toggle.className = 'folder-tree-toggle';
            if (folder.children && folder.children.length > 0) {
                toggle.innerHTML = '<i class="fas fa-chevron-right"></i>';
            } else {
                toggle.innerHTML = '';
            }
            
            const item = document.createElement('div');
            item.className = 'folder-item-tree';
            
            const iconColor = getFolderColor(folder.name);
            const lockIcon = folder.is_protected ? ' <i class="fas fa-lock" style="color:#ef4444; font-size: 0.8rem; margin-left: 5px;" title="Защищено паролем"></i>' : '';
            item.innerHTML = `<i class="fas fa-folder" style="color: ${iconColor};"></i> ${escapeHtml(folder.name)}${lockIcon}`;
            if (currentFolderId === folder.id) {
                item.classList.add('active');
            }
            
            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'folder-tree-node';
            
            if (expandedFolders.has(folder.id)) {
                childrenContainer.classList.add('expanded');
                toggle.classList.add('expanded');
            }
            
            toggle.onclick = (e) => {
                e.stopPropagation();
                if (folder.children && folder.children.length > 0) {
                    if (expandedFolders.has(folder.id)) {
                        expandedFolders.delete(folder.id);
                        childrenContainer.classList.remove('expanded');
                        toggle.classList.remove('expanded');
                    } else {
                        expandedFolders.add(folder.id);
                        childrenContainer.classList.add('expanded');
                        toggle.classList.add('expanded');
                    }
                }
            };
            
            item.onclick = () => {
                expandedFolders.add(folder.id);
                parentFolderIdHistory = [];
                folderNameHistory = [];
                document.getElementById('search-input').value = '';
                
                document.querySelectorAll('.folder-item-tree').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                if (folder.children && folder.children.length > 0) {
                    childrenContainer.classList.add('expanded');
                    toggle.classList.add('expanded');
                }
                
                loadDocuments(folder.id, folder.name, false, null, folder.is_protected);
            };
            
            header.appendChild(toggle);
            header.appendChild(item);
            wrapper.appendChild(header);
            
            if (folder.children && folder.children.length > 0) {
                folder.children.forEach(child => {
                    childrenContainer.appendChild(renderTreeNode(child));
                });
                wrapper.appendChild(childrenContainer);
            }
            
            return wrapper;
        }

        function hideContextMenu() {
            const cm = document.getElementById('custom-context-menu');

            document.querySelectorAll('.docs-table-row.selected').forEach(el => el.classList.remove('selected'));

        function showContextMenuAt(x, y, htmlContent) {
            const cm = document.getElementById('custom-context-menu');
            if (!cm) return;
            cm.innerHTML = htmlContent;
            cm.style.display = 'block';

            // Check viewport boundaries
            const cmWidth = cm.offsetWidth || 230;
            const cmHeight = cm.offsetHeight || 250;
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;

            let finalX = x;
            let finalY = y;

            if (x + cmWidth > winWidth) {
                finalX = winWidth - cmWidth - 10;
            }
            if (y + cmHeight > winHeight) {
                finalY = winHeight - cmHeight - 10;
            }

            cm.style.left = `${Math.max(10, finalX)}px`;
            cm.style.top = `${Math.max(10, finalY)}px`;
        }

            if (row) row.classList.add('selected');

            let html = '';
            if (isFolder) {
                html = `
                    <div class="context-menu-header">${escapeHtml(item.name)}</div>

                        <i class="fas fa-folder-open"></i> Открыть

                    <div class="context-menu-item" onclick="openRenameModal('${item.id}', '${escapeHtml(item.name)}', ${item.is_protected})">

                    </div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item danger" onclick="deleteItem('${item.id}', event, ${item.is_protected})">

                        <i class="fas fa-eye"></i> Просмотреть

                    <div class="context-menu-item" onclick="downloadFile('${item.id.replace('file_','')}', '${escapeHtml(item.name)}', event, ${item.is_protected})">
                        <i class="fas fa-download"></i> Скачать

                    <div class="context-menu-item" onclick="copyItemLink('${viewUrl}', ${item.is_protected})">

                    <div class="context-menu-separator"></div>

                        <i class="fas fa-i-cursor"></i> Переименовать
                    </div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item danger" onclick="deleteItem('${item.id}', event, ${item.is_protected})">
                        <i class="fas fa-trash"></i> Удалить

        function openItemMoreMenu(e, item, isFolder) {
            e.stopPropagation();

                preventDefault: () => {},

                currentTarget: e.currentTarget.closest('.docs-table-row'),
                clientX: rect.left,
                clientY: rect.bottom + 4
            }, item, isFolder);

        async function copyItemLink(viewUrl, isProtected) {
            hideContextMenu();
            let finalUrl = viewUrl.startsWith('http') ? viewUrl : `${window.location.origin}${viewUrl}`;
            try {
                await navigator.clipboard.writeText(finalUrl);
                showToast('Ссылка скопирована в буфер обмена');
            } catch (err) {
                prompt('Скопируйте ссылку:', finalUrl);
            }
        }

        function openCreateDocModal(type) {
            createDocType = type;
            const modalTitle = document.getElementById('create-doc-modal-title');
            const docNameInput = document.getElementById('new-doc-name');
            const btnSubmit = document.getElementById('btn-submit-create-doc');

            if (type === 'document') {
                modalTitle.innerText = 'Создать Google Документ';
                docNameInput.placeholder = 'Например: Сменный акт осмотра оборудования';
                btnSubmit.style.background = '#2563eb';
            } else {
                modalTitle.innerText = 'Создать Google Таблицу';
                docNameInput.placeholder = 'Например: Журнал регистрации простоев';
                btnSubmit.style.background = '#10b981';
            }

            docNameInput.value = '';
            document.getElementById('create-doc-modal').style.display = 'flex';
            setTimeout(() => docNameInput.focus(), 50);
        }

        function closeCreateDocModal() {
            document.getElementById('create-doc-modal').style.display = 'none';
        }

        async function submitCreateGoogleDoc() {
            let requiresPassword = currentFolderProtected;
            if (!currentFolderId) requiresPassword = true;
            if (!await ensurePassword(requiresPassword)) return;

            const name = document.getElementById('new-doc-name').value.trim();
            if (!name) {
                alert('Пожалуйста, введите название файла');
                return;
            }

            const btnSubmit = document.getElementById('btn-submit-create-doc');
            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Создание...';
            btnSubmit.disabled = true;

            const formData = new FormData();
            formData.append('title', name);
            formData.append('doc_type', createDocType);
            if (currentFolderId) formData.append('parent_id', currentFolderId);

            try {
                const res = await fetch('/api/documents/create_google', {
                    method: 'POST',
                    headers: getFolderPasswordHeader(),
                    body: formData
                });
                const data = await res.json();
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;

                if (data.status === 'success') {
                    closeCreateDocModal();
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                    showToast('Google документ успешно создан');
                    
                    // Открываем документ сразу в новой вкладке
                    if (data.file && data.file.webViewLink) {
                        window.open(data.file.webViewLink, '_blank');
                    }
                } else {
                    alert('Ошибка создания: ' + data.message);
                }
            } catch (err) {
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;
                alert('Ошибка соединения с сервером');
            }
        }

        let renameTargetId = null;
        let renameTargetProtected = false;

        function openRenameModal(itemId, currentName, isProtected) {
            hideContextMenu();
            renameTargetId = itemId;
            renameTargetProtected = isProtected;
            const renameInput = document.getElementById('rename-input');
            renameInput.value = currentName;
            document.getElementById('rename-modal').style.display = 'flex';
            setTimeout(() => {
                renameInput.focus();
                renameInput.select();
            }, 50);
        }

        function closeRenameModal() {
            document.getElementById('rename-modal').style.display = 'none';
            renameTargetId = null;
        }

        async function submitRename() {
            if (renameTargetProtected || currentFolderProtected) {
                if (!await ensurePassword(true)) return;
            }
            const newName = document.getElementById('rename-input').value.trim();
            if (!newName) return;

            const formData = new FormData();
            formData.append('new_name', newName);

            try {
                const res = await fetch(`/api/documents/${renameTargetId}/rename`, {
                    method: 'PUT',
                    headers: getFolderPasswordHeader(),
                    body: formData
                });
                const data = await res.json();
                if (data.status === 'success') {
                    closeRenameModal();
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                    loadSidebarTree();
                    showToast('Успешно переименовано');
                } else {
                    alert('Ошибка: ' + data.message);
                }
            } catch (err) {
                alert('Ошибка соединения');
            }
        }

                                ${file.is_protected ? ' <i class="fas fa-lock" style="color:#ef4444; font-size: 0.8rem; margin-left: 5px;" title="Защищено паролем"></i>' : ''}
                            </a>
                        </div>

                        <div class="row-actions">
                            ${isEditableFile(file.name) ? `
                                <a href="#" onclick="openFileLink('/editor?id=${file.id}', ${file.is_protected}, event)" class="btn-icon btn-icon-edit" style="color: #f59e0b;" title="Редактировать в Google">
                                    <i class="fas fa-edit"></i>
                                </a>
                            ` : ''}
                            <a href="#" onclick="openFileLink('${viewUrl}', ${file.is_protected}, event)" class="btn-icon" title="Просмотреть">
                                <i class="fas fa-eye"></i>
                            </a>
                            <button class="btn-icon btn-icon-more" onclick="openItemMoreMenu(event, ${fileJson}, false)" title="Меню файла">

                            </button>

                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;

        function goUp() {
            if (parentFolderIdHistory.length > 0) {
                const prevId = parentFolderIdHistory.pop();
                const prevName = folderNameHistory.pop();
                document.getElementById('search-input').value = '';
                loadDocuments(prevId, prevName, false);
            }
        }

        async function handleFileUpload(event) {
            if (!await ensurePassword(currentFolderProtected)) {
                event.target.value = '';
                return;
            }
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            if (currentFolderId) {
                formData.append('parent_id', currentFolderId);
            }

            const container = document.getElementById('files-container');
            container.innerHTML = `
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка файла...</div>
            ` + container.innerHTML;

            try {
                const res = await fetch('/api/documents/upload', {
                    method: 'POST',
                    headers: getFolderPasswordHeader(),
                    body: formData
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                } else {
                    alert('Ошибка загрузки: ' + data.message);
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                }
            } catch (error) {
                alert('Ошибка соединения');
                loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
            }
            
            event.target.value = '';
        }

        async function handleFolderUpload(event) {
            if (!await ensurePassword(currentFolderProtected)) {
                event.target.value = '';
                return;
            }
            const files = event.target.files;
            if (files.length === 0) return;

            const container = document.getElementById('files-container');
            const total = files.length;
            
            container.innerHTML = `
                <div class="loading" id="folder-upload-progress"><i class="fas fa-spinner fa-spin"></i> Загрузка папки: 0 из ${total} файлов...</div>
            ` + container.innerHTML;

            const progressEl = document.getElementById('folder-upload-progress');
            let successCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const formData = new FormData();
                formData.append('file', file);
                
                if (currentFolderId) {
                    formData.append('parent_id', currentFolderId);
                }
                
                if (file.webkitRelativePath) {
                    formData.append('relative_path', file.webkitRelativePath);
                }

                try {
                    await fetch('/api/documents/upload', {
                        method: 'POST',
                        headers: getFolderPasswordHeader(),
                        body: formData
                    });
                    successCount++;
                    if (progressEl) {
                        progressEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Загрузка папки: ${successCount} из ${total} файлов...`;
                    }
                } catch (error) {
                    console.error('Ошибка загрузки файла:', file.name, error);
                }
            }
            
            loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
            loadSidebarTree();
            event.target.value = '';
        }

        async function deleteItem(itemId, event, isProtected = false) {
            event.stopPropagation();
            if (isProtected || currentFolderProtected) {
                if (!await ensurePassword(true)) return;
            }
            if (!confirm('Вы уверены, что хотите удалить этот элемент?')) return;

            try {
                const res = await fetch(`/api/documents/${itemId}`, { 
                    method: 'DELETE',
                    headers: getFolderPasswordHeader()
                });
                const data = await res.json();
                if (data.status === 'success') {
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                    loadSidebarTree();
                } else {
                    alert('Ошибка при удалении: ' + data.message);
                }
            } catch (error) {
                alert('Ошибка соединения');
            }
        }

        function showFolderModal() { document.getElementById('folder-modal').style.display = 'flex'; }
        function closeFolderModal() { 
            document.getElementById('folder-modal').style.display = 'none'; 
            document.getElementById('new-folder-name').value = '';
        }

        async function createFolder() {
            let requiresPassword = currentFolderProtected;
            if (!currentFolderId) {
                requiresPassword = true; // Создание корневой папки требует пароль
            }
            if (!await ensurePassword(requiresPassword)) return;
            
            const name = document.getElementById('new-folder-name').value.trim();
            if (!name) return;

            const formData = new FormData();
            formData.append('folder_name', name);
            if (currentFolderId) formData.append('parent_id', currentFolderId);

            try {
                const res = await fetch('/api/documents/folders', {
                    method: 'POST',
                    headers: getFolderPasswordHeader(),
                    body: formData
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    closeFolderModal();
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                    if (!currentFolderId) {
                        loadDocuments(); 
                    }
                    loadSidebarTree();
                } else {
                    alert('Ошибка: ' + data.message);
                }
            } catch (error) {
                alert('Ошибка соединения');
            }
        }

        async function downloadFile(fileId, fileName, event, isProtected = false) {
            if (event) event.stopPropagation();
            if (isProtected && !await ensurePassword(true)) return;
            try {
                const res = await fetch(`/api/documents/download/${fileId}`, { 
                    headers: getFolderPasswordHeader() 
                });
                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } else {
                    alert('Ошибка скачивания: Нет доступа');
                }
            } catch (e) {
                console.error(e);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadDocuments();
            loadSidebarTree();
        });
    </script>
</body>
</html>
