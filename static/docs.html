<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База Знаний - Tectum Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .docs-sidebar {
            width: 280px;
            background: #1e293b;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 2rem;
        }

        .folder-tree-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .folder-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0.8rem;
            color: #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.2rem;
            font-size: 0.95rem;
        }

        .folder-item:hover, .folder-item.active {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        /* Main Content */
        .docs-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 2rem;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 450px;
        }

        .search-box input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(30, 41, 59, 0.8);
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3b82f6;
            background: #1e293b;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .action-buttons {
            display: flex;
            gap: 0.8rem;
        }

        .btn-action {
            padding: 0.65rem 1.1rem;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-create-folder {
            background: #334155;
            color: #f8fafc;
        }
        .btn-create-folder:hover { background: #475569; }

        .btn-upload-folder {
            background: #10b981;
            color: white;
        }
        .btn-upload-folder:hover { background: #059669; }

        .btn-upload-file {
            background: #3b82f6;
            color: white;
        }
        .btn-upload-file:hover { background: #2563eb; }

        .btn-back {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .btn-back:hover {
            color: #fff;
            border-color: #94a3b8;
        }

        .page-title {
            margin: 0 0 1.5rem 0;
            font-size: 1.6rem;
            font-weight: 700;
        }

        /* Table / List View (Google Drive style) */
        .docs-table {
            display: flex;
            flex-direction: column;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .docs-table-header {
            display: grid;
            grid-template-columns: 2fr 1fr 100px;
            padding: 0.8rem 1.2rem;
            background: rgba(15, 23, 42, 0.8);
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .docs-table-row {
            display: grid;
            grid-template-columns: 2fr 1fr 100px;
            padding: 0.85rem 1.2rem;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
        }

        .docs-table-row:last-child {
            border-bottom: none;
        }

        .docs-table-row:hover {
            background: rgba(51, 65, 85, 0.4);
        }

        .folder-row {
            cursor: pointer;
        }

        .row-name {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            overflow: hidden;
        }

        .item-title {
            color: #f1f5f9;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-link {
            color: #f1f5f9;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.2s;
        }

        .file-link:hover {
            color: #60a5fa;
            text-decoration: underline;
        }

        .row-meta {
            color: #94a3b8;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.4rem;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: #64748b;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon-download:hover {
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.15);
        }

        .btn-icon-delete:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #64748b;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Modal Styles */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1e293b; padding: 2.5rem; border-radius: 16px; width: 90%; max-width: 450px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .modal h3 { margin-top: 0; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #cbd5e1; }
        .form-group input { 
            width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.2); color: white; box-sizing: border-box;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; }
        .btn-cancel { background: transparent; color: #94a3b8; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="docs-sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-folder-tree"></i> База Знаний
        </div>
        
        <div class="folder-tree-title">Главные разделы</div>
        <div id="sidebar-folders">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>
        </div>
        
        <div style="margin-top: auto;">
            <a href="/static/index.html" style="color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#94a3b8'">
                <i class="fas fa-home"></i> На главную
            </a>
        </div>
    </div>

    <div class="docs-content">
        <div class="top-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Поиск в Базе Знаний..." oninput="handleSearch(this.value)">
            </div>
            <div class="action-buttons">
                <button class="btn-action btn-create-folder" onclick="showFolderModal()">
                    <i class="fas fa-folder-plus"></i> Новая папка
                </button>
                <button class="btn-action btn-upload-folder" onclick="document.getElementById('folder-upload').click()">
                    <i class="fas fa-folder-open"></i> Загрузить папку
                </button>
                <input type="file" id="folder-upload" webkitdirectory directory multiple style="display: none;" onchange="handleFolderUpload(event)">
                <button class="btn-action btn-upload-file" onclick="document.getElementById('file-upload').click()">
                    <i class="fas fa-cloud-upload-alt"></i> Загрузить файл
                </button>
                <input type="file" id="file-upload" style="display: none;" onchange="handleFileUpload(event)">
            </div>
        </div>

        <div>
            <button id="btn-back" class="btn-back" style="display: none;" onclick="goUp()">
                <i class="fas fa-arrow-left"></i> Назад
            </button>
            <h1 id="current-folder-name" class="page-title">Главная директория</h1>
        </div>

        <div id="files-container">
            <!-- Файлы и папки загрузятся сюда в формате таблицы -->
        </div>
    </div>

    <!-- Модалка новой папки -->
    <div id="folder-modal" class="modal">
        <div class="modal-content">
            <h3>Создать новую папку</h3>
            <div class="form-group">
                <label>Название папки</label>
                <input type="text" id="new-folder-name" placeholder="Например: Отдел кадров">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeFolderModal()">Отмена</button>
                <button class="btn-action btn-upload-file" onclick="createFolder()">Создать</button>
            </div>
        </div>
    </div>

    <script>
        let currentFolderId = null;
        let parentFolderIdHistory = [];
        let folderNameHistory = [];
        let searchTimeout = null;

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function getFileIcon(mimeType, fileName = '') {
            const name = fileName.toLowerCase();
            if (mimeType.includes('pdf') || name.endsWith('.pdf')) {
                return { icon: 'fas fa-file-pdf', color: '#ef4444' };
            }
            if (mimeType.includes('spreadsheet') || mimeType.includes('excel') || name.endsWith('.xlsx') || name.endsWith('.xls')) {
                return { icon: 'fas fa-file-excel', color: '#10b981' };
            }
            if (mimeType.includes('document') || mimeType.includes('word') || name.endsWith('.docx') || name.endsWith('.doc')) {
                return { icon: 'fas fa-file-word', color: '#3b82f6' };
            }
            if (mimeType.includes('image') || name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.jpeg')) {
                return { icon: 'fas fa-file-image', color: '#f59e0b' };
            }
            return { icon: 'fas fa-file-alt', color: '#94a3b8' };
        }

        function getFileTypeName(fileName, mimeType) {
            const ext = fileName.split('.').pop().toUpperCase();
            if (ext && ext !== fileName.toUpperCase()) return `${ext} документ`;
            return 'Документ';
        }

        function getWebViewLink(file) {
            const name = (file.name || '').toLowerCase();
            const directUrl = window.location.origin + file.webViewLink;
            if (isEditableFile(name)) {
                return `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(directUrl)}`;
            }
            return file.webViewLink;
        }

        function isEditableFile(fileName) {
            const name = (fileName || '').toLowerCase();
            return name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.docx') || name.endsWith('.doc') || name.endsWith('.pptx') || name.endsWith('.ppt');
        }

        async function loadDocuments(folderId = null, folderName = 'Главная директория', addToHistory = true, searchQuery = null) {
            const container = document.getElementById('files-container');
            const sidebar = document.getElementById('sidebar-folders');
            
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка документов...</div>';
            
            try {
                let url = '/api/documents/list';
                const params = new URLSearchParams();
                if (searchQuery) {
                    params.append('q', searchQuery);
                } else if (folderId) {
                    params.append('parent_id', folderId);
                }
                if (params.toString()) {
                    url += '?' + params.toString();
                }
                
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.status === 'success') {
                    if (addToHistory && currentFolderId !== folderId && !searchQuery) {
                        if (currentFolderId) {
                            parentFolderIdHistory.push(currentFolderId);
                            folderNameHistory.push(document.getElementById('current-folder-name').innerText);
                        }
                    }
                    
                    if (!searchQuery) {
                        currentFolderId = folderId;
                    }
                    document.getElementById('current-folder-name').innerText = folderName;
                    
                    const btnBack = document.getElementById('btn-back');
                    if (parentFolderIdHistory.length > 0 && !searchQuery) {
                        btnBack.style.display = 'inline-flex';
                    } else {
                        btnBack.style.display = 'none';
                    }

                    if (!folderId && !searchQuery) {
                        renderSidebarFolders(data.data.folders);
                    }
                    
                    renderItems(data.data.folders, data.data.files);
                    
                } else {
                    container.innerHTML = `<div style="color: #ef4444; padding: 2rem;">Ошибка: ${data.message}</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div style="color: #ef4444; padding: 2rem;">Ошибка загрузки данных</div>`;
            }
        }

        function handleSearch(query) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const trimmed = query.trim();
                if (trimmed.length > 0) {
                    loadDocuments(null, `Результаты поиска: "${trimmed}"`, false, trimmed);
                } else {
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                }
            }, 300);
        }

        function renderSidebarFolders(folders) {
            const sidebar = document.getElementById('sidebar-folders');
            sidebar.innerHTML = '';
            folders.forEach(folder => {
                const div = document.createElement('div');
                div.className = 'folder-item';
                div.innerHTML = `<i class="fas fa-folder"></i> ${escapeHtml(folder.name)}`;
                div.onclick = () => {
                    parentFolderIdHistory = [];
                    folderNameHistory = [];
                    document.getElementById('search-input').value = '';
                    loadDocuments(folder.id, folder.name, false);
                };
                sidebar.appendChild(div);
            });
        }

        function renderItems(folders, files) {
            const container = document.getElementById('files-container');
            if (folders.length === 0 && files.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>В этой директории пока нет документов или папок</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="docs-table">
                    <div class="docs-table-header">
                        <div>Название</div>
                        <div>Тип</div>
                        <div style="text-align: right;">Действия</div>
                    </div>
            `;

            // Вывод папок
            folders.forEach(folder => {
                html += `
                    <div class="docs-table-row folder-row" onclick="loadDocuments('${folder.id}', '${escapeHtml(folder.name)}')">
                        <div class="row-name">
                            <i class="fas fa-folder" style="color: #60a5fa; font-size: 1.2rem;"></i>
                            <span class="item-title">${escapeHtml(folder.name)}</span>
                        </div>
                        <div class="row-meta">Папка</div>
                        <div class="row-actions">
                            <button class="btn-icon btn-icon-delete" onclick="deleteItem('${folder.id}', event)" title="Удалить папку">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            // Вывод файлов
            files.forEach(file => {
                const iconInfo = getFileIcon(file.mimeType, file.name);
                const typeName = getFileTypeName(file.name, file.mimeType);
                const viewUrl = getWebViewLink(file);
                html += `
                    <div class="docs-table-row">
                        <div class="row-name">
                            <i class="${iconInfo.icon}" style="color: ${iconInfo.color}; font-size: 1.2rem;"></i>
                            <a href="${viewUrl}" target="_blank" class="file-link" title="${escapeHtml(file.name)}">
                                ${escapeHtml(file.name)}
                            </a>
                        </div>
                        <div class="row-meta">${typeName}</div>
                        <div class="row-actions">
                            ${isEditableFile(file.name) ? `
                                <a href="/static/editor.html?id=${file.id}" target="_blank" class="btn-icon btn-icon-edit" style="color: #f59e0b;" title="Редактировать онлайн (OnlyOffice)">
                                    <i class="fas fa-pen-to-square"></i>
                                </a>
                            ` : ''}
                            <a href="${viewUrl}" target="_blank" class="btn-icon btn-icon-download" title="Просмотреть в браузере">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a href="${file.webViewLink}" download class="btn-icon btn-icon-download" title="Скачать оригинальный файл">
                                <i class="fas fa-download"></i>
                            </a>
                            <button class="btn-icon btn-icon-delete" onclick="deleteItem('${file.id}', event)" title="Удалить файл">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function goUp() {
            if (parentFolderIdHistory.length > 0) {
                const prevId = parentFolderIdHistory.pop();
                const prevName = folderNameHistory.pop();
                document.getElementById('search-input').value = '';
                loadDocuments(prevId, prevName, false);
            }
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            if (currentFolderId) {
                formData.append('parent_id', currentFolderId);
            }

            const container = document.getElementById('files-container');
            container.innerHTML = `
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка файла...</div>
            ` + container.innerHTML;

            try {
                const res = await fetch('/api/documents/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                } else {
                    alert('Ошибка загрузки: ' + data.message);
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                }
            } catch (error) {
                alert('Ошибка соединения');
                loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
            }
            
            event.target.value = '';
        }

        async function handleFolderUpload(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            const container = document.getElementById('files-container');
            const total = files.length;
            
            container.innerHTML = `
                <div class="loading" id="folder-upload-progress"><i class="fas fa-spinner fa-spin"></i> Загрузка папки: 0 из ${total} файлов...</div>
            ` + container.innerHTML;

            const progressEl = document.getElementById('folder-upload-progress');
            let successCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const formData = new FormData();
                formData.append('file', file);
                
                if (currentFolderId) {
                    formData.append('parent_id', currentFolderId);
                }
                
                if (file.webkitRelativePath) {
                    formData.append('relative_path', file.webkitRelativePath);
                }

                try {
                    await fetch('/api/documents/upload', {
                        method: 'POST',
                        body: formData
                    });
                    successCount++;
                    if (progressEl) {
                        progressEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Загрузка папки: ${successCount} из ${total} файлов...`;
                    }
                } catch (error) {
                    console.error('Ошибка загрузки файла:', file.name, error);
                }
            }
            
            loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
            event.target.value = '';
        }

        async function deleteItem(itemId, event) {
            event.stopPropagation();
            if (!confirm('Вы уверены, что хотите удалить этот элемент?')) return;

            try {
                const res = await fetch(`/api/documents/${itemId}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.status === 'success') {
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                } else {
                    alert('Ошибка при удалении: ' + data.message);
                }
            } catch (error) {
                alert('Ошибка соединения');
            }
        }

        function showFolderModal() { document.getElementById('folder-modal').style.display = 'flex'; }
        function closeFolderModal() { 
            document.getElementById('folder-modal').style.display = 'none'; 
            document.getElementById('new-folder-name').value = '';
        }

        async function createFolder() {
            const name = document.getElementById('new-folder-name').value.trim();
            if (!name) return;

            const formData = new FormData();
            formData.append('folder_name', name);
            if (currentFolderId) formData.append('parent_id', currentFolderId);

            try {
                const res = await fetch('/api/documents/folders', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    closeFolderModal();
                    loadDocuments(currentFolderId, document.getElementById('current-folder-name').innerText, false);
                    if (!currentFolderId) {
                        loadDocuments(); 
                    }
                } else {
                    alert('Ошибка: ' + data.message);
                }
            } catch (error) {
                alert('Ошибка соединения');
            }
        }

        window.addEventListener('DOMContentLoaded', () => loadDocuments());
    </script>
</body>
</html>
