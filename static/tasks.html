<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планнер задач — Tectum Engineering</title>
    <link rel="icon" type="image/png" href="/static/img/Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=20260826_planner_v1">

    <style>
        :root {
            --tbl-border: rgba(255, 255, 255, 0.08);
            --tbl-hover: rgba(255, 255, 255, 0.03);
            --tbl-header-bg: rgba(30, 41, 59, 0.95);
            --status-queue-bg: rgba(148, 163, 184, 0.15);
            --status-queue-color: #cbd5e1;
            --status-work-bg: rgba(245, 158, 11, 0.15);
            --status-work-color: #fbbf24;
            --status-done-bg: rgba(16, 185, 129, 0.15);
            --status-done-color: #34d399;
            --status-moved-bg: rgba(59, 130, 246, 0.15);
            --status-moved-color: #60a5fa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .planner-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--tbl-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
        }
        .header-brand img { height: 36px; }
        .header-brand h1 {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }
        .header-brand span {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
            display: block;
        }

        /* Navigation Toolbar */
        .toolbar {
            background: rgba(30, 41, 59, 0.7);
            border-bottom: 1px solid var(--tbl-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .select-filter {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--tbl-border);
            color: #f8fafc;
            padding: 0.45rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .select-filter:focus {
            border-color: #3b82f6;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-decoration: none;
            font-family: inherit;
        }
        .btn-primary-action {
            background: #2563eb;
            color: #ffffff;
        }
        .btn-primary-action:hover {
            background: #1d4ed8;
        }
        .btn-secondary-action {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            border: 1px solid var(--tbl-border);
        }
        .btn-secondary-action:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }
        .btn-archive-action {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }
        .btn-archive-action:hover {
            background: rgba(139, 92, 246, 0.3);
        }

        /* Main Table Container */
        .table-container {
            flex: 1;
            padding: 1rem 1.5rem;
            overflow-x: auto;
        }

        .planner-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--tbl-border);
            border-radius: 10px;
            overflow: hidden;
        }

        .planner-table th {
            background: var(--tbl-header-bg);
            color: #94a3b8;
            font-weight: 600;
            text-align: left;
            padding: 0.75rem 0.6rem;
            border-bottom: 1px solid var(--tbl-border);
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .planner-table td {
            padding: 0.6rem;
            border-bottom: 1px solid var(--tbl-border);
            color: #e2e8f0;
            vertical-align: middle;
        }

        .planner-table tr:hover td {
            background: var(--tbl-hover);
        }

        .badge-code {
            font-family: monospace;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            color: #93c5fd;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .badge-zone {
            display: inline-block;
            background: rgba(59, 130, 246, 0.1);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Status Select in row */
        .select-status {
            appearance: none;
            -webkit-appearance: none;
            padding: 0.3rem 0.6rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid transparent;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            text-align: center;
        }
        .status-queue { background: var(--status-queue-bg); color: var(--status-queue-color); border-color: rgba(148, 163, 184, 0.3); }
        .status-work { background: var(--status-work-bg); color: var(--status-work-color); border-color: rgba(245, 158, 11, 0.3); }
        .status-done { background: var(--status-done-bg); color: var(--status-done-color); border-color: rgba(16, 185, 129, 0.3); }
        .status-moved { background: var(--status-moved-bg); color: var(--status-moved-color); border-color: rgba(59, 130, 246, 0.3); }

        .btn-photo-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            background: rgba(6, 182, 212, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(6, 182, 212, 0.3);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-photo-link:hover {
            background: rgba(6, 182, 212, 0.3);
        }

        /* Quick actions cell */
        .row-actions {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .btn-icon-cell {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.3rem;
            font-size: 0.85rem;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }
        .btn-icon-cell:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-icon-cell.delete:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        /* Modal dialogs */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-box {
            background: #1e293b;
            border: 1px solid var(--tbl-border);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 1.15rem;
            color: #f8fafc;
        }
        .modal-close {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.25rem;
            cursor: pointer;
        }
        .form-row {
            margin-bottom: 1rem;
        }
        .form-row label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.35rem;
        }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            box-sizing: border-box;
            background: #0f172a;
            border: 1px solid var(--tbl-border);
            border-radius: 8px;
            padding: 0.55rem 0.8rem;
            color: #f8fafc;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: #3b82f6;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            border: 1px solid var(--tbl-border);
            color: #f8fafc;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 2000;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .planner-header, .toolbar, .table-container {
                padding: 0.6rem 0.8rem;
            }
            .hide-mobile {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="planner-header">
        <a href="/" class="header-brand">
            <img src="/static/img/Logo.png" alt="Tectum Logo">
            <div>
                <h1>TECTUM TASKS</h1>
                <span>ПЛАННЕР ПО БЕРЕЖЛИВОМУ ПРОИЗВОДСТВУ</span>
            </div>
        </a>

        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <a href="/static/docs.html" class="btn-action btn-secondary-action" title="База знаний">
                <i class="fa-solid fa-folder-open"></i> <span class="hide-mobile">База знаний</span>
            </a>
            <a href="/" class="btn-action btn-secondary-action" title="На главную">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
    </header>

    <!-- Toolbar: Month/Week Selector & Action Buttons -->
    <div class="toolbar">
        <div class="toolbar-group">
            <!-- Mode Switch: Active Plan / Archive -->
            <button class="btn-action btn-primary-action" id="btn-mode-active" onclick="switchViewMode('active')">
                <i class="fa-solid fa-list-check"></i> План
            </button>
            <button class="btn-action btn-secondary-action" id="btn-mode-archive" onclick="switchViewMode('archive')">
                <i class="fa-solid fa-box-archive"></i> Архив
            </button>

            <!-- Month Selector -->
            <select class="select-filter" id="filter-month" onchange="onMonthChange()" style="font-weight: bold; background: #1e293b; color: #38bdf8; border-color: #38bdf8;">
                <option value="Август 2026">Август 2026</option>
            </select>

            <!-- Week Selector (Mon-Fri) -->
            <select class="select-filter" id="filter-week" onchange="loadTasks()" style="font-weight: 600; background: #1e293b; color: #fbbf24; border-color: rgba(245, 158, 11, 0.4);">
                <!-- Populated dynamically -->
            </select>
        </div>

        <div class="toolbar-group">
            <!-- Add Task Button -->
            <button class="btn-action btn-primary-action" onclick="openAddTaskModal()">
                <i class="fa-solid fa-plus"></i> <span class="hide-mobile">Добавить задачу</span>
            </button>

            <!-- Complete Week Button -->
            <button class="btn-action btn-archive-action" id="btn-archive-week" onclick="archiveCurrentWeek()">
                <i class="fa-solid fa-calendar-check"></i> <span class="hide-mobile">Завершить неделю</span>
            </button>

            <!-- Sync from Google Sheets -->
            <button class="btn-action btn-secondary-action" onclick="syncFromGoogleSheets()" title="Импорт из Google Таблицы">
                <i class="fa-solid fa-cloud-arrow-down"></i> <span class="hide-mobile">Google Sync</span>
            </button>
        </div>
    </div>

    <!-- Main Table -->
    <main class="table-container">
        <table class="planner-table">
            <thead>
                <tr>
                    <th style="width: 70px;">ID</th>
                    <th style="width: 150px;">
                        <div style="margin-bottom: 4px;">Зона / Служба</div>
                        <select class="select-filter" id="table-filter-zone" onchange="loadTasks()" style="width: 100%; font-size: 0.72rem; padding: 2px 4px;">
                            <option value="all">📁 Все зоны</option>
                            <option value="Ремонт и зоны">Ремонт и зоны</option>
                            <option value="Инфостенды">Инфостенды</option>
                            <option value="Обучение">Обучение</option>
                            <option value="Цифровой портал">Цифровой портал</option>
                            <option value="СКК">СКК</option>
                            <option value="Документация">Документация</option>
                            <option value="Цилиндры">Цилиндры</option>
                            <option value="Дестакер">Дестакер</option>
                            <option value="Дозировка">Дозировка</option>
                            <option value="ЗО">ЗО</option>
                            <option value="Зона двигателей">Зона двигателей</option>
                            <option value="Слесарная мастерская">Слесарная мастерская</option>
                            <option value="Бережливое производство">Бережливое производство</option>
                        </select>
                    </th>
                    <th>Суть задачи (RU)</th>
                    <th>Суть задачи (KZ)</th>
                    <th style="width: 60px; text-align: center;">Фото</th>
                    <th style="width: 130px;">
                        <div style="margin-bottom: 4px;">Автор</div>
                        <select class="select-filter" id="table-filter-author" onchange="loadTasks()" style="width: 100%; font-size: 0.72rem; padding: 2px 4px;">
                            <option value="all">✍️ Все авторы</option>
                        </select>
                    </th>
                    <th style="width: 140px;">
                        <div style="margin-bottom: 4px;">Исполнитель</div>
                        <select class="select-filter" id="table-filter-assignee" onchange="loadTasks()" style="width: 100%; font-size: 0.72rem; padding: 2px 4px;">
                            <option value="all">👤 Все исполн.</option>
                        </select>
                    </th>
                    <th style="width: 80px;">Срок</th>
                    <th style="width: 135px; text-align: center;">
                        <div style="margin-bottom: 4px;">Статус</div>
                        <select class="select-filter" id="table-filter-status" onchange="loadTasks()" style="width: 100%; font-size: 0.72rem; padding: 2px 4px;">
                            <option value="all">⚡ Все статусы</option>
                            <option value="⚪ В очереди">⚪ В очереди</option>
                            <option value="🟡 В работе">🟡 В работе</option>
                            <option value="🟢 Выполнено">🟢 Выполнено</option>
                            <option value="🔵 Перенесено">🔵 Перенесено</option>
                        </select>
                    </th>
                    <th>Факт / Комментарий</th>
                    <th style="width: 70px; text-align: center;">Действия</th>
                </tr>
            </thead>
            <tbody id="tasks-table-body">
                <tr>
                    <td colspan="11" style="text-align: center; padding: 2rem; color: #94a3b8;">
                        <i class="fa-solid fa-spinner fa-spin"></i> Загрузка задач...
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <!-- CREATE / EDIT TASK MODAL -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Новая задача</h3>
                <button class="modal-close" onclick="closeTaskModal()">&times;</button>
            </div>
            
            <input type="hidden" id="task-id-input" value="">

            <!-- Task text: Single input with instant auto-translation -->
            <div class="form-row">
                <label>Суть задачи (RU) *</label>
                <textarea class="form-textarea" id="task-ru-input" rows="2" placeholder="Например: Установить инфостенд на участке ЛФМ..." oninput="debounceAutoTranslateModal()" required></textarea>
            </div>

            <div class="form-row">
                <label>Суть задачи (KZ) <span style="font-weight: normal; color: #94a3b8;">(автоперевод)</span></label>
                <input type="text" class="form-input" id="task-kz-input" placeholder="Автоматический перевод на казахский...">
            </div>

            <!-- Zone & Photo Link -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;" class="form-row">
                <div>
                    <label>Зона / Служба</label>
                    <select class="form-select" id="task-zone-input">
                        <option value="Ремонт и зоны">Ремонт и зоны</option>
                        <option value="Инфостенды">Инфостенды</option>
                        <option value="Обучение">Обучение</option>
                        <option value="Цифровой портал">Цифровой портал</option>
                        <option value="СКК">СКК</option>
                        <option value="Документация">Документация</option>
                        <option value="Цилиндры">Цилиндры</option>
                        <option value="Дестакер">Дестакер</option>
                        <option value="Дозировка">Дозировка</option>
                        <option value="ЗО">ЗО</option>
                        <option value="Зона двигателей">Зона двигателей</option>
                        <option value="Слесарная мастерская">Слесарная мастерская</option>
                        <option value="Бережливое производство" selected>Бережливое производство</option>
                    </select>
                </div>
                <div>
                    <label>Ссылка на фото (Google Диск / Облако)</label>
                    <input type="url" class="form-input" id="task-photo-input" placeholder="https://drive.google.com/...">
                </div>
            </div>

            <!-- Author & Assignee -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;" class="form-row">
                <div>
                    <label>Автор задачи</label>
                    <select class="form-select" id="task-author-input">
                        <option value="">-- Выберите автора --</option>
                    </select>
                </div>
                <div>
                    <label>Исполнитель</label>
                    <select class="form-select" id="task-assignee-input">
                        <option value="">-- Выберите исполнителя --</option>
                    </select>
                </div>
            </div>

            <!-- Deadline with Clickable Quick Selectors & Status -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;" class="form-row">
                <div>
                    <label>Срок выполнения</label>
                    <div style="display: flex; gap: 0.35rem; margin-bottom: 0.35rem; flex-wrap: wrap;">
                        <button type="button" class="btn-action btn-secondary-action" style="font-size: 0.7rem; padding: 2px 6px;" onclick="setDueQuick('Пн')">Пн</button>
                        <button type="button" class="btn-action btn-secondary-action" style="font-size: 0.7rem; padding: 2px 6px;" onclick="setDueQuick('Вт')">Вт</button>
                        <button type="button" class="btn-action btn-secondary-action" style="font-size: 0.7rem; padding: 2px 6px;" onclick="setDueQuick('Ср')">Ср</button>
                        <button type="button" class="btn-action btn-secondary-action" style="font-size: 0.7rem; padding: 2px 6px;" onclick="setDueQuick('Чт')">Чт</button>
                        <button type="button" class="btn-action btn-secondary-action" style="font-size: 0.7rem; padding: 2px 6px;" onclick="setDueQuick('Пт')">Пт</button>
                        <button type="button" class="btn-action btn-secondary-action" style="font-size: 0.7rem; padding: 2px 6px;" onclick="setDueQuick('В теч. недели')">В теч. нед.</button>
                    </div>
                    <input type="text" class="form-input" id="task-due-input" placeholder="Напр. 28.08 или Пт">
                </div>
                <div>
                    <label>Статус</label>
                    <select class="form-select" id="task-status-input" style="margin-top: 1.5rem;">
                        <option value="⚪ В очереди">⚪ В очереди</option>
                        <option value="🟡 В работе">🟡 В работе</option>
                        <option value="🟢 Выполнено">🟢 Выполнено</option>
                        <option value="🔵 Перенесено">🔵 Перенесено</option>
                    </select>
                </div>
            </div>

            <!-- Comment -->
            <div class="form-row">
                <label>Факт / Комментарий</label>
                <input type="text" class="form-input" id="task-comment-input" placeholder="Ход выполнения, замечания...">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
                <button type="button" class="btn-action btn-secondary-action" onclick="closeTaskModal()">Отмена</button>
                <button type="button" class="btn-action btn-primary-action" onclick="saveTaskModal()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="toast" id="toast-msg">
        <i class="fa-solid fa-circle-check" style="color: #34d399;"></i>
        <span id="toast-text">Готово</span>
    </div>

    <script src="/static/js/tasks.js?v=20260826_planner_filters_v3"></script>
</body>
</html>
